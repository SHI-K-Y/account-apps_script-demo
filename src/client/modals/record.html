  <div id="editRecordModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">

        <div class="modal-header-text">

        <div class="edit-field edit-field-item" id="editItemField">
          <span class="edit-label">項目</span>
          <div id="editItemChoices" class="choices edit-choices"></div>
        </div>

        <div class="edit-field edit-field-category" id="editCategoryField">
          <span class="edit-label">總類</span>
          <div id="editCategoryChoices" class="choices edit-choices"></div>
        </div>

        <div class="edit-field edit-field-payment" id="editPaymentField">
          <span class="edit-label">支付方式</span>
          <div id="editPaymentChoices" class="choices edit-choices"></div>
        </div>

        <div class="edit-field edit-field-paid paid-collapsible is-collapsed" id="editPaidField" hidden inert>

        <div class="edit-field edit-field-amount" id="editAmountField">

        <div class="edit-field edit-field-note" id="editNoteField">

      </div>

      <div class="modal-actions">
        <button id="editModalCancelBtn" class="modal-btn modal-cancel-btn" type="button">取消</button>
        <button id="editModalSubmitBtn" class="modal-btn modal-submit-btn" type="button">儲存修改</button>
      </div>
    </div>
