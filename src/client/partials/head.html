  <title>記帳簿-快速記帳網頁</title>
  <script>
    (function() {
      try {
        var isDark = false;
        if (window.matchMedia) {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <style id="bootLoaderStyle">
    /* 樣式表的層順序（P07）：後面的層一律蓋過前面的層，與選擇器權重無關。必須是頁面上第一條 CSS 規則；
     * 與 manifest.json 的 layerOrder 相同（建置時檢查）。boot＝這段開機畫面、icons＝圖示子集、其餘是主樣式表（style.html）。 */
    @layer boot, icons, tokens, base, components, glass, effects, overrides;
    /* Hallmark · checked: 2026-11-12 · genre: editorial (inferred) · shape: app screen
     * floor: 15 FAIL left, each checked by hand as a linter misread (4, 15, 38i, 62, 76) · fixed: 48, 67, 7b, 74, 40 (hover ink), F1, F3 · kept by owner: 29 Liquid Glass, F7 capsules, 11 hover lift
     * built: the project · redesign: polish · v2.0.0 */
    /* Hallmark · dismissed 4 · the flagged nodes are Phosphor icon tags named ph-credit-card and a recessed well, not a nested card */
    /* Hallmark · dismissed 15 · both rules are overridden by later focus-visible blocks that drop outline and box-shadow from the transition list */
    /* Hallmark · dismissed 38i · the i element inside each h2 is a Phosphor caret icon inside a toggle button, not italic text */
    /* Hallmark · dismissed 62 · head-hidden is a scroll state class the script adds; theme icons swap one for the other; progress and the native picker indicator are hidden on purpose */
    /* Hallmark · dismissed 40 · disabled buttons are exempt in WCAG; modal-close has a dark-theme override; fx-menu and sr-badge resolve to later scoped tokens that pass */
    @layer boot {
    :root { --boot-bg:#faf6ef; --boot-ink:#1c1c1e; --boot-accent:#c93a2c; --boot-accent-2:#db4637; --boot-alert:#db4637; --boot-on:#fffcf7; --boot-track:rgba(28, 28, 30,.08); --boot-ghost:rgba(28, 28, 30,.07); --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
    html[data-theme="dark"] { --boot-bg:#000000; --boot-ink:#faf6ef; --boot-track:rgba(250,246,239,.1); --boot-ghost:rgba(250,246,239,.1); }
    html { background: var(--boot-bg); }
    html[data-theme="dark"] { background: var(--boot-bg); }
    .boot-loader {
      position: fixed; inset: 0; z-index: 2147483000;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      background: var(--boot-bg); color: var(--boot-ink);
      font: 15px/1.45 var(--font-body);
      -webkit-tap-highlight-color: transparent;
      transition: opacity .4s cubic-bezier(.16,1,.3,1), visibility .4s;
    }
    html[data-theme="dark"] .boot-loader { background: var(--boot-bg); color: var(--boot-ink); }
    .boot-loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-card { width: min(300px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
    .boot-ring { position: relative; width: 104px; height: 104px; margin-bottom: 4px; }
    .boot-ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
    .boot-ring circle { fill: none; stroke-width: 7; }
    .boot-ring .boot-trk { stroke: var(--boot-track); }
    html[data-theme="dark"] .boot-ring .boot-trk { stroke: var(--boot-track); }
    .boot-ring .boot-val { stroke: url(#bootGrad); stroke-linecap: round; transition: stroke-dashoffset .18s linear; }
    .boot-pct {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em;
    }
    .boot-pct small { font-size: 13px; font-weight: 600; opacity: .55; margin: 6px 0 0 1px; }
    .boot-title { font-size: 17px; font-weight: 700; letter-spacing: .06em; }
    .boot-stage { min-height: 1.45em; font-size: 14px; opacity: .78; }
    .boot-meta {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px;
      font-size: 12px; opacity: .5; font-variant-numeric: tabular-nums;
    }
    .boot-meta .is-off { color: var(--boot-alert); opacity: 1; font-weight: 600; }
    .boot-hint { margin-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .boot-hint[hidden] { display: none; }
    .boot-hint p { margin: 0; font-size: 13px; opacity: .75; }
    .boot-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .boot-btn {
      appearance: none; -webkit-appearance: none; border: 0; border-radius: 999px;
      min-height: 40px; padding: 10px 20px; cursor: pointer;
      font: inherit; font-size: 14px; font-weight: 600; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--boot-accent); color: var(--boot-on);
    }
    .boot-btn.is-ghost { background: var(--boot-ghost); color: inherit; }
    html[data-theme="dark"] .boot-btn.is-ghost { background: var(--boot-ghost); }

    @media (prefers-reduced-motion: reduce) {

    }
    }
  </style>
