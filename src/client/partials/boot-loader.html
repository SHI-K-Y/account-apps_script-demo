  <div class="uv-glow-bg" aria-hidden="true"><canvas class="uv-glow-canvas" width="1" height="1"></canvas></div>
  <div class="boot-loader" id="bootLoader" role="progressbar" aria-label="記帳簿載入中" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="boot-card">
      <div class="boot-ring" aria-hidden="true">
        <svg viewBox="0 0 104 104" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" style="stop-color: var(--boot-accent-2)"/><stop offset="1" style="stop-color: var(--boot-accent)"/>
            </linearGradient>
          </defs>
          <circle class="boot-trk" cx="52" cy="52" r="44"/>
          <circle class="boot-val" id="bootRing" cx="52" cy="52" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46"/>
        </svg>
        <span class="boot-sweep" aria-hidden="true"></span>
        <div class="boot-pct"><span id="bootPct">0</span><small>%</small></div>
      </div>
      <div class="boot-title">記帳簿</div>
      <div class="boot-stage" id="bootStage" aria-live="polite">正在連線…</div>
      <div class="boot-meta"><span id="bootNet"></span><span id="bootTime"></span></div>
      <div class="boot-hint" id="bootHint" hidden>
        <p id="bootHintText">網路似乎比較慢，仍在努力載入中…</p>
        <div class="boot-actions">
          <a class="boot-btn" id="bootReload" href="<?= typeof execUrl !== 'undefined' && execUrl ? execUrl : '#' ?>" target="_top">重新載入</a>
          <button class="boot-btn is-ghost" id="bootSkip" type="button" hidden>先進入</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    /* 載入畫面（P08）：
     *  - 進度環：requestAnimationFrame 逐幀推進（依經過時間換算，速度與以前每 100ms 一格相同），只在數字或文字真的變了才寫入 DOM；
     *    <html> 加上 boot-ready 時立刻停止。
     *  - 旋轉光弧（.boot-sweep）：只動 transform: rotate() 的 CSS 動畫，由合成器執行——主執行緒忙著開機、rAF 停住時仍然會轉。
     *    減少動態效果、或偏好設定的「動畫效果」是關閉時不顯示（與其他動畫的規則相同）。 */
    (function () {
      var root = document.getElementById('bootLoader');
      if (!root) return;
      var $ = function (id) { return document.getElementById(id); };
      var ring = $('bootRing'), pct = $('bootPct'), stage = $('bootStage');
      var netEl = $('bootNet'), timeEl = $('bootTime');
      var hint = $('bootHint'), hintText = $('bootHintText'), skipBtn = $('bootSkip'), reloadBtn = $('bootReload');
      var CIRC = 2 * Math.PI * 44;
      var shown = 0, target = 0, cap = 0.04;
      var lastStepAt = now(), lastFrame = now(), finished = false, hadError = false, raf = 0;
      var drawn = { p: -1, ring: '', net: null, time: '' };
      var STALL_MS = 10000;

      try {
        var prefs = JSON.parse(localStorage.getItem('FAST_BOOKKEEPING_PREFS_V1') || 'null');
        if (prefs && prefs.motion === 'off') root.classList.add('is-static');
      } catch (e) {}

      function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

      function render() {
        var p = Math.min(100, Math.round(shown * 100));
        var off = (CIRC * (1 - Math.min(1, shown))).toFixed(2);
        if (off !== drawn.ring) { ring.style.strokeDashoffset = off; drawn.ring = off; }
        if (p !== drawn.p) { pct.textContent = p; root.setAttribute('aria-valuenow', p); drawn.p = p; }
      }

      function netLabel() {
        if (navigator.onLine === false) return { text: '目前沒有網路連線', off: true };
        var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!c) return { text: '', off: false };
        var t = c.effectiveType ? String(c.effectiveType).toUpperCase() : '';
        var d = (typeof c.downlink === 'number' && c.downlink > 0) ? ('約 ' + c.downlink + ' Mbps') : '';
        return { text: ['網路', t, d].filter(Boolean).join(' '), off: false };
      }

      function updateMeta() {
        var n = netLabel();
        var key = n.text + (n.off ? '|off' : '');
        if (key !== drawn.net) { netEl.textContent = n.text; netEl.className = n.off ? 'is-off' : ''; drawn.net = key; }
        var time = '已等待 ' + (now() / 1000).toFixed(1) + ' 秒';
        if (time !== drawn.time) { timeEl.textContent = time; drawn.time = time; }
      }

      function showHint(msg, allowSkip) {
        hintText.textContent = msg;
        hint.hidden = false;
        if (allowSkip) skipBtn.hidden = false;
      }

      function frame() {
        raf = 0;
        if (finished) return;
        var t = now();
        var k = Math.min(10, Math.max(0, (t - lastFrame) / 100));   // 經過幾個「100ms 格」
        lastFrame = t;
        if (shown < target) shown += Math.max((target - shown) * (1 - Math.pow(0.7, k)), 0.005 * k);
        else if (shown < cap) shown += (cap - shown) * (1 - Math.pow(0.965, k));
        if (shown > Math.max(target, cap)) shown = Math.max(target, cap);
        render();
        updateMeta();
        if (!hadError && hint.hidden && t - lastStepAt > STALL_MS) {
          showHint(navigator.onLine === false
            ? '目前沒有網路連線，連線恢復後請按「重新載入」。'
            : '網路似乎比較慢，仍在努力載入中…若一直停在這裡，可以按「重新載入」。', false);
        }
        raf = requestAnimationFrame(frame);
      }

      function hide() {
        if (finished) return;
        finished = true;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        shown = 1; render();
        stage.textContent = '完成';
        document.documentElement.classList.add('boot-ready');
        // 常駐動畫、背景光暈（BootPhase.ready）、延後程式的保險排程都從這個事件開始
        try { window.dispatchEvent(new Event('bootready')); } catch (e) {}
        setTimeout(function () {
          root.classList.add('is-done');
          setTimeout(function () { if (root.parentNode) root.parentNode.removeChild(root); }, 450);
        }, 180);
      }

      window.__boot = {
        step: function (p, label, nextCap) {
          if (finished) return;
          target = Math.max(target, p);
          cap = Math.max(target, typeof nextCap === 'number' ? nextCap : p);
          if (label && stage.textContent !== label) stage.textContent = label;
          lastStepAt = now();
          if (!hadError && !hint.hidden && skipBtn.hidden) hint.hidden = true;
        },
        fail: function (msg) {
          if (finished) return;
          hadError = true;
          stage.textContent = '載入時發生問題';
          showHint(msg || '載入時發生錯誤，建議按「重新載入」再試一次。', true);
        },
        done: hide,
        get finished() { return finished; },
        get hadError() { return hadError; }
      };

      skipBtn.addEventListener('click', hide);
      reloadBtn.addEventListener('click', function (e) {
        if (reloadBtn.getAttribute('href') === '#') { e.preventDefault(); location.reload(); }
        stage.textContent = '重新載入中…';
      });
      window.addEventListener('error', function (ev) {
        if (finished || (ev && ev.target && ev.target !== window)) return;
        window.__boot.fail();
      }, true);
      window.addEventListener('offline', updateMeta);
      window.addEventListener('online', updateMeta);

      window.__boot.step(0.05, '正在載入外觀樣式…', 0.24);
      updateMeta(); render();
      raf = requestAnimationFrame(frame);
    })();
  </script>
