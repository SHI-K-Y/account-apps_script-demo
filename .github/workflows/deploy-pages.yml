# 把 docs/（建置好的 Demo 網站）部署到 GitHub Pages。
#
# 第一次使用：Repo 的 Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
# 之後每次 push 到 main 且 docs/ 有變更就會自動部署；也可以在 Actions 頁面手動執行。
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
